<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0614"/>
      <stop offset="45%" stop-color="#1A0B2E"/>
      <stop offset="100%" stop-color="#2D1B4E"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E9D5FF">
        <animate attributeName="stop-color" values="#E9D5FF;#A855F7;#8B5CF6;#E9D5FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#7C3AED;#E9D5FF;#A855F7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8B5CF6" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <circle cx="1030" cy="70" r="180" fill="url(#glow1)">
    <animate attributeName="opacity" values="0.55;0.85;0.55" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="180;200;180" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="260" r="160" fill="url(#glow2)">
    <animate attributeName="opacity" values="0.35;0.6;0.35" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="160;180;160" dur="5s" repeatCount="indefinite"/>
  </circle>

  <line x1="0" y1="299" x2="1200" y2="299" stroke="#7C3AED" stroke-width="2"/>

  <g opacity="0.55">
    <circle cx="700" cy="250" r="2.5" fill="#A855F7">
      <animate attributeName="cy" values="250;30;250" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="280" r="2" fill="#8B5CF6">
      <animate attributeName="cy" values="280;20;280" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="260" r="3" fill="#E9D5FF">
      <animate attributeName="cy" values="260;40;260" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="7.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="200" r="1.8" fill="#7C3AED">
      <animate attributeName="cy" values="200;10;200" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="150" r="2.2" fill="#A855F7">
      <animate attributeName="cy" values="150;280;150" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="90" r="2" fill="#8B5CF6">
      <animate attributeName="cy" values="90;260;90" dur="8.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.55;0" dur="8.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0.9" font-family="JetBrains Mono, Consolas, monospace">
    <text x="80" y="95" font-size="15" fill="#8B5CF6" letter-spacing="4">B.TECH IT STUDENT · MERN &amp; AI DEVELOPER</text>
  </g>

  <text x="78" y="165" font-family="JetBrains Mono, Consolas, monospace" font-size="58" font-weight="700" fill="url(#textGrad)">Karan Shakarwal</text>

  <text x="80" y="205" font-family="JetBrains Mono, Consolas, monospace" font-size="17" fill="#C4B5FD" opacity="0.85">Final-year IT undergrad building full-stack apps with React · Node.js · MongoDB</text>

  <rect x="726" y="191" width="10" height="18" fill="#A855F7">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#7C3AED" opacity="0.8">
    <rect x="80" y="230" width="118" height="30" rx="6" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-opacity="0.5"/>
    <text x="96" y="250" fill="#E9D5FF">React.js</text>

    <rect x="210" y="230" width="130" height="30" rx="6" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.5"/>
    <text x="226" y="250" fill="#E9D5FF">Node.js</text>

    <rect x="352" y="230" width="130" height="30" rx="6" fill="#A855F7" fill-opacity="0.12" stroke="#A855F7" stroke-opacity="0.5"/>
    <text x="368" y="250" fill="#E9D5FF">MongoDB</text>

    <rect x="494" y="230" width="150" height="30" rx="6" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-opacity="0.5"/>
    <text x="510" y="250" fill="#E9D5FF">Gemini AI</text>
  </g>

  <g opacity="0.5">
    <circle cx="1120" cy="240" r="3" fill="#A855F7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1140" cy="220" r="2" fill="#8B5CF6">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="200" r="2.5" fill="#7C3AED">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1150" cy="260" r="2" fill="#E9D5FF">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
