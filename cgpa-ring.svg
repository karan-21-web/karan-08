  </circle>

  <text x="90" y="82" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="34" font-weight="700" fill="#E9D5FF">8.23</text>
  <text x="90" y="106" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#A855F7">CGPA / 10</text>
