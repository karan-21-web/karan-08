    <animate attributeName="stroke-dashoffset" from="452.4" to="80.1" dur="1.8s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
  </circle>

  <circle cx="90" cy="18" r="5" fill="#E9D5FF">
